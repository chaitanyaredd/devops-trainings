name: CI — build & publish

# # Needed to push container to GHCR using GITHUB_TOKEN
# permissions:
#   contents: read
#   packages: write

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 and cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: 'maven'

      - name: Build WAR (run tests)
        run: mvn -B clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-java-tomcat-app-war
          path: target/my-java-tomcat-app.war

